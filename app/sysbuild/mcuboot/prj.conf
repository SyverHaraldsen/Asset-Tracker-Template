CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=16384

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=y
CONFIG_BOOT_BOOTSTRAP=n

# Keep the rejected secondary slot around so we can see *why* MCUboot
# rejected it instead of having it silently wiped.
CONFIG_MCUBOOT_CLEANUP_UNUSABLE_SECONDARY=n

### mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set



CONFIG_FLASH=y
CONFIG_FPROTECT=y


CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
### Debug log level so validation-failure paths speak up.
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_DBG=y
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0
### Use the minimal C library to reduce flash usage
CONFIG_MINIMAL_LIBC=y

# Increase the monotonic firmware version before building a firmware update
CONFIG_FW_INFO=y
CONFIG_FW_INFO_FIRMWARE_VERSION=1
